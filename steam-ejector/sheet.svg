<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="Three-stage steam ejector vacuum system flowsheet">
<style>
  .box{fill:#ffffff;stroke:#1b1b1b;stroke-width:1.5}
  .ves{fill:#f4f6f8;stroke:#1b1b1b;stroke-width:1.5}
  .pipe{fill:none;stroke:#1b1b1b;stroke-width:1.5}
  .steam{fill:none;stroke:#0072B2;stroke-width:1.5;stroke-dasharray:6 3}
  .cw{fill:none;stroke:#009E73;stroke-width:1.5;stroke-dasharray:2 3}
  .lbl{font-family:Arial,Helvetica,sans-serif;font-size:13px;fill:#1b1b1b}
  .sm{font-family:Arial,Helvetica,sans-serif;font-size:12px;fill:#5a5a5a}
  .tag{font-family:Arial,Helvetica,sans-serif;font-size:13px;font-weight:bold;fill:#1b1b1b}
</style>
<!-- motive steam header -->
<line class="steam" x1="120" y1="40" x2="880" y2="40"/>
<text class="lbl" x="20" y="44">Motive steam</text>
<text class="sm" x="20" y="60">0.8 MPa abs, sat.</text>
<line class="steam" x1="250" y1="40" x2="250" y2="110"/>
<line class="steam" x1="520" y1="40" x2="520" y2="110"/>
<line class="steam" x1="790" y1="40" x2="790" y2="110"/>
<!-- vessel -->
<rect class="ves" x="30" y="180" width="110" height="120" rx="4"/>
<text class="tag" x="48" y="205">Vessel</text>
<text class="sm" x="42" y="225">2 kPa abs</text>
<text class="sm" x="42" y="243">150 kg/h</text>
<text class="sm" x="42" y="261">50 dry + 100 vap.</text>
<!-- stage 1 ejector -->
<line class="pipe" x1="140" y1="240" x2="210" y2="240"/>
<polygon class="box" points="210,215 290,215 270,265 210,265"/>
<text class="tag" x="212" y="205">E-101</text>
<text class="lbl" x="212" y="285">Stage 1 ejector</text>
<text class="sm" x="212" y="302">278.3 kg/h steam</text>
<!-- intercondenser 1 -->
<line class="pipe" x1="270" y1="240" x2="330" y2="240"/>
<rect class="box" x="330" y="190" width="80" height="100" rx="4"/>
<text class="tag" x="348" y="212">C-101</text>
<text class="sm" x="338" y="232">7.40 kPa</text>
<text class="sm" x="338" y="250">231.3 kW</text>
<text class="lbl" x="322" y="310">Barometric</text>
<text class="lbl" x="322" y="326">intercondenser 1</text>
<!-- stage 2 ejector -->
<line class="pipe" x1="410" y1="240" x2="470" y2="240"/>
<polygon class="box" points="470,215 550,215 530,265 470,265"/>
<text class="tag" x="472" y="205">E-102</text>
<text class="lbl" x="472" y="285">Stage 2 ejector</text>
<text class="sm" x="472" y="302">205.2 kg/h steam</text>
<!-- intercondenser 2 -->
<line class="pipe" x1="530" y1="240" x2="590" y2="240"/>
<rect class="box" x="590" y="190" width="80" height="100" rx="4"/>
<text class="tag" x="608" y="212">C-102</text>
<text class="sm" x="598" y="232">27.38 kPa</text>
<text class="sm" x="598" y="250">173.5 kW</text>
<text class="lbl" x="582" y="310">Barometric</text>
<text class="lbl" x="582" y="326">intercondenser 2</text>
<!-- stage 3 ejector -->
<line class="pipe" x1="670" y1="240" x2="730" y2="240"/>
<polygon class="box" points="730,215 810,215 790,265 730,265"/>
<text class="tag" x="732" y="205">E-103</text>
<text class="lbl" x="732" y="285">Stage 3 ejector</text>
<text class="sm" x="732" y="302">151.6 kg/h steam</text>
<!-- aftercondenser -->
<line class="pipe" x1="790" y1="240" x2="850" y2="240"/>
<rect class="box" x="850" y="190" width="80" height="100" rx="4"/>
<text class="tag" x="866" y="212">C-103</text>
<text class="sm" x="856" y="232">101.3 kPa</text>
<text class="sm" x="856" y="250">118.8 kW</text>
<text class="lbl" x="848" y="310">Surface</text>
<text class="lbl" x="832" y="326">aftercondenser</text>
<!-- vent -->
<line class="pipe" x1="890" y1="190" x2="890" y2="150"/>
<text class="lbl" x="820" y="140">Vent 51.4 kg/h</text>
<!-- cooling water -->
<line class="cw" x1="370" y1="120" x2="370" y2="190"/>
<line class="cw" x1="630" y1="120" x2="630" y2="190"/>
<line class="cw" x1="890" y1="120" x2="890" y2="190"/>
<line class="cw" x1="330" y1="120" x2="930" y2="120"/>
<text class="lbl" x="330" y="105">Cooling water in, 25 °C, 45.1 m3/h total</text>
<!-- barometric legs to hot well -->
<line class="pipe" x1="370" y1="290" x2="370" y2="470"/>
<line class="pipe" x1="630" y1="290" x2="630" y2="470"/>
<line class="pipe" x1="890" y1="290" x2="890" y2="430"/>
<text class="sm" x="378" y="380">20,259 kg/h</text>
<text class="sm" x="378" y="396">336.9 kg/h condensate</text>
<text class="sm" x="638" y="380">15,180 kg/h</text>
<text class="sm" x="638" y="396">241.0 kg/h condensate</text>
<text class="sm" x="820" y="360">155.9 kg/h</text>
<!-- hot well -->
<rect class="ves" x="300" y="470" width="360" height="60" rx="4"/>
<text class="tag" x="310" y="495">V-101 Hot well</text>
<text class="sm" x="310" y="515">Hot-well overflow 35,595.2 kg/h at about 35 °C</text>
<line class="pipe" x1="660" y1="500" x2="760" y2="500"/>
<text class="lbl" x="770" y="505">Condensate</text>
<!-- hot-well vent to atmosphere -->
<line class="pipe" x1="500" y1="470" x2="500" y2="438"/>
<polygon class="box" points="500,426 494,438 506,438"/>
<text class="sm" x="500" y="420" text-anchor="middle">Vent to atmosphere</text>
<!-- aftercondenser cooling-water return -->
<line class="cw" x1="932" y1="290" x2="932" y2="445"/>
<line class="cw" x1="932" y1="445" x2="700" y2="445"/>
<polygon points="700,445 712,439 712,451" fill="#1b1b1b"/>
<text class="sm" x="712" y="438">CW return 10.23 m3/h</text>
<!-- flow labels on main line -->
<text class="sm" x="150" y="228">150 kg/h</text>
<text class="sm" x="292" y="228">428.3 kg/h</text>
<text class="sm" x="420" y="228">91.4 kg/h</text>
<text class="sm" x="548" y="228">296.7 kg/h</text>
<text class="sm" x="680" y="228">55.7 kg/h</text>
<text class="sm" x="800" y="228">207.3 kg/h</text>
</svg>
