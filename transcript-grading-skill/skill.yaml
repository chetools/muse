name: local_transcript_grading
title: Grade a Sealed Transcript or Audio Take
description: "Grade a sealed spoken-explanation take with the teacher's prompt and rubric fetched from the course server, and upload the critique and per-element grades. For a text-sealed take the server verifies the transcript against its sealed master copy; for an audio-sealed take, download the sealed per-slide audio from the server, transcribe it, grade that transcript, and upload all three — the server stores the transcript, compares it against its own transcription of the sealed audio when configured, and audit re-grades. Trigger when a student asks to transcribe and/or grade their take and provides a course server address and a sealed session code."
include_in_prompt: true
availability:
  confidential_vm: true
  needs_speech: false
skill_improvement:
  managed: true
  needs_review: true
