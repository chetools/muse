name: local_chemescribe
title: ChemEScribe — Transcribe Audio with Parakeet and the Chemical-Engineering Glossary
description: "ChemEScribe: transcribe an audio file the user points to or uploads, locally with NVIDIA Parakeet TDT 0.6B v2 (int8, CPU, through onnx-asr), then correct the transcript for chemical-engineering and general-engineering terms with the bundled glossary: a 755-entry glossary, a 744-term vocabulary and 203 sound-alike correction pairs in two classes — a 145-pair certain map applied outright and 58 uncertain pairs decided by bundled context rules or rendered in slash form (7 attested pairs across both classes, the rest predicted and labelled). Any common audio format is accepted and converted with ffmpeg. Timestamps are a user option, off by default: with them, each roughly 25 second chunk of the transcript carries its time range in the recording, preserved through the correction passes. The audio never leaves the machine, ONNX Runtime telemetry is disabled in the runner, the raw transcript is kept as the record, and every correction is listed for review. Trigger when the user asks to transcribe a recording, lecture, interview, meeting or explanation, or points Muse at an audio file (WAV, MP3, M4A, WebM, OGG, MP4) and asks what was said."
include_in_prompt: true
availability:
  confidential_vm: true
  needs_speech: false
skill_improvement:
  managed: true
  needs_review: true
