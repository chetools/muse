[package]
name = "lec-trim"
version = "0.1.1"
edition = "2021"
description = "Trim and stitch OBS homework recordings at spoken 'start recording' / 'stop recording' cues, locally."
license = "MIT"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Native folder-picker dialog for the double-click interface.
# Windows-only: on other platforms the picker is not compiled in.
[target.'cfg(windows)'.dependencies]
rfd = "0.15"

[profile.release]
opt-level = 3
